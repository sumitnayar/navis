<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- SEO & Branding -->
  <title>NAVIS | Board Risk Intelligence Platform</title>
  <meta name="description" content="AI-native Board Risk Intelligence System for Indian SaaS and growth-stage companies. Transform risk assessment from compliance audits into strategic boardroom decisions in under 5 minutes.">
  
  <!-- Style Frameworks -->
  <link rel="stylesheet" href="app.css?v=3.0.3">
  
  <!-- Supabase Cloud DB Core SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- PDF.js for text extraction (classic build, not module) -->
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <!-- SheetJS for Excel/CSV parsing -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- Mammoth.js for Word (.docx) parsing -->
  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
  <script src="config.js"></script>
</head>
<body>

  <div id="public-route-container" class="public-route-container"></div>

  <div class="app-container is-hidden" id="app-container" aria-hidden="true">
    
    <!-- GLOBAL TOP NAVIGATION BAR -->
    <header class="top-nav no-print" id="top-nav">

      <!-- LEFT: Brand -->
      <div class="top-nav-brand">
        <div class="nv-logo">NV</div>
        <span class="top-nav-wordmark">NAVIS</span>
      </div>

      <!-- CENTER: Module navigation -->
      <nav class="top-nav-modules" id="top-nav-modules">
        <div class="top-nav-item" id="nav-dashboard" data-tab="dashboard">Dashboard</div>
        <div class="top-nav-item" id="nav-intelligencePolicy" data-tab="intelligencePolicy">Intelligence & Policy</div>
        <div class="top-nav-item" id="nav-boardQA" data-tab="boardQA">Q&A Assistant</div>
        <div class="top-nav-item" id="nav-objectives" data-tab="objectives">Objectives</div>
        <div class="top-nav-item" id="nav-scenario" data-tab="scenario">Scenario Lab</div>
        <div class="top-nav-item" id="nav-network" data-tab="network">Cascade Map</div>
        <div class="top-nav-item" id="nav-portfolio" data-tab="portfolio">Portfolio Mapper</div>
        <div class="top-nav-item" id="nav-boardPack" data-tab="boardPack">Board Pack</div>
      </nav>

      <!-- RIGHT: Context and account -->
      <div class="top-nav-right">
        <span class="top-nav-company" id="top-nav-company"></span>
        <div class="top-nav-divider"></div>
        <span class="top-nav-settings" id="top-nav-settings" title="Platform Settings">⚙</span>
        <div class="top-nav-divider"></div>
        <span class="top-nav-signout" id="top-nav-signout">Sign Out</span>
      </div>

    </header>

    <!-- MAIN VIEWPORT DISPLAY AREA -->
    <main class="main-content">
      


      <div id="page-render-container">
        <!-- Dynamic modules inject content here -->
      </div>
      <footer class="private-preview-footer no-print">Navis MVP v0.3 &mdash; Private Preview</footer>
    </main>

  </div>

  <!-- Boot Module -->
  <script type="module" src="app.js?v=3.0.3"></script>

</body>
</html>
