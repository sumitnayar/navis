<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- SEO & Branding -->
  <title>Navis | AI-native governance and enterprise risk intelligence</title>
  <meta name="description" content="Navis is an AI-native governance and enterprise risk intelligence platform for boards, leadership teams, risk professionals and growing organizations.">
  
  <!-- Style Frameworks -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css?v=3.0.4">
  <link rel="stylesheet" href="styles/designSystem.css?v=3.0.4">
  <link rel="stylesheet" href="styles/publicSite.css?v=1.0.0">
  
  <!-- Supabase Cloud DB Core SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- PDF.js for text extraction (classic build, not module) -->
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <!-- SheetJS for Excel/CSV parsing -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- Mammoth.js for Word (.docx) parsing -->
  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
  <!-- PDF generation -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  
  <script src="config.js"></script>
</head>
<body>

  <div id="public-route-container" class="public-route-container"></div>

  <div class="app-container is-hidden" id="app-container" aria-hidden="true">
    
    <!-- GLOBAL TOP NAVIGATION BAR -->
    <header class="top-nav no-print" id="top-nav">

      <!-- LEFT: Brand -->
      <div class="top-nav-brand">
        <div class="nv-logo">NV</div>
        <span class="top-nav-wordmark">NAVIS</span>
      </div>

      <!-- CENTER: Module navigation -->
      <nav class="top-nav-modules" id="top-nav-modules">
        <!-- Rendered dynamically by app.js based on active operating mode -->
      </nav>

      <!-- RIGHT: Context and account -->
      <div class="top-nav-right">
        <span class="top-nav-company" id="top-nav-company"></span>
        <div class="top-nav-divider" id="settings-divider"></div>
        <span class="top-nav-settings" id="top-nav-settings" title="Platform Settings">⚙</span>
        <div class="top-nav-divider"></div>
        <span class="top-nav-signout" id="top-nav-signout">Sign Out</span>
      </div>

    </header>

    <!-- MAIN VIEWPORT DISPLAY AREA -->
    <main class="main-content">
      


      <div id="page-render-container">
        <!-- Dynamic modules inject content here -->
      </div>
      <footer class="private-preview-footer no-print">Navis MVP v0.3 &mdash; Private Preview</footer>
    </main>

  </div>

  <!-- Chart.js UMD build — sets window.Chart globally -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <!-- Boot Module -->
  <script type="module" src="app.js?v=1.1.3"></script>

</body>
</html>
