<svg xmlns="http://www.w3.org/2000/svg" width="512" height="128" viewBox="0 0 512 128" role="img" aria-labelledby="title desc">
  <title id="title">Navis logo</title>
  <desc id="desc">Navis gradient N mark with dark wordmark</desc>
  <defs>
    <linearGradient id="navis-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D64261"/>
      <stop offset="62%" stop-color="#087F88"/>
      <stop offset="100%" stop-color="#11B8B2"/>
    </linearGradient>
  </defs>
  <rect x="12" y="12" width="104" height="104" rx="22" fill="url(#navis-gradient)"/>
  <text x="64" y="82" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="800" text-anchor="middle">N</text>
  <text x="148" y="83" fill="#0B1426" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="0">NAVIS</text>
</svg>
